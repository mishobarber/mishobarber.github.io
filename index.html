<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Գրանցում · Միշո</title>
<meta name="description" content="Առցանց գրանցում բարբերշոփում">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0c'/%3E%3Cpath d='M10 4h12v24H10z' fill='%23f2ead8'/%3E%3Cpath d='M10 8l12-4v6L10 14zM10 20l12-4v6l-12 4z' fill='%23d4af37'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wdth,wght@62.5..100,400..900&family=Noto+Serif+Armenian:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="sign band">
  <div class="wrap">
    <div>
      <h1 id="shopName">Բարբերշոփ</h1>
      <p id="shopInfo">Առցանց գրանցում</p>
      <div class="tools" id="tools" aria-hidden="true"></div>
    </div>
    <div id="pole"></div>
  </div>
</header>

<main class="band" style="padding-top:8px">
<div class="wrap">
  <div id="mineBox" hidden style="padding-top:22px">
    <h2>Ձեր գրանցումները</h2>
    <div class="mine" id="mine"></div>
  </div>
  <div id="notReady" class="empty" style="margin-top:22px">Բեռնվում է…</div>
  <div id="flow" hidden>
    <div class="step" id="s1"><h2><span class="n">1</span>Ընտրեք ծառայությունները</h2><p id="svcHint" style="margin:-6px 0 12px;color:var(--mute)"></p><div class="grid" id="svcs"></div></div>
    <div class="step" id="s2"><h2><span class="n">2</span>Ընտրեք վարսավիրին</h2><div class="grid" id="bars"></div></div>
    <div class="step" id="s3"><h2><span class="n">3</span>Օրը և ժամը</h2><div class="book-cal"><div class="cal-nav"><button class="btn ghost" data-act="bm" data-v="-1" aria-label="Նախորդ ամիս">‹</button><b id="bmT"></b><button class="btn ghost" data-act="bm" data-v="1" aria-label="Հաջորդ ամիս">›</button></div><div id="days"></div><p id="dayT" style="margin:10px 0 0;font-weight:700"></p></div><div style="height:14px"></div><div id="times"></div></div>
    <div class="step" id="s4" style="border:0">
      <h2><span class="n">4</span>Ձեր տվյալները</h2>
      <div class="row2">
        <div><label for="cName">Անուն</label><input id="cName" autocomplete="name" placeholder="Արամ" maxlength="60"></div>
        <div><label for="cPhone">Հեռախոս</label><input id="cPhone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+374 99 123456" maxlength="30"></div>
      </div>
      <div id="summary"></div>
      <button class="btn big" id="bookBtn" data-act="book">Գրանցվել</button>
      <div class="msg" id="bookMsg" role="status"></div>
    </div>
  </div>
</div>
</main>
<div class="foot" id="foot">Գրանցումը պահվում է անմիջապես · ժամը զբաղվում է ձեզ համար</div>

<div class="ov" id="ov" hidden><div class="done" role="dialog" aria-modal="true" aria-labelledby="okT">
  <div class="top"><h3 id="okT">Դուք գրանցված եք</h3><div style="opacity:.9">Սպասում ենք ձեզ</div></div>
  <div class="body"><div id="okBody"></div><a class="btn big wa" id="okWa" href="#" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>Ուղարկել WhatsApp-ով</a>
    <button class="btn big ghost" data-act="okclose" style="margin-top:10px">Լավ</button></div>
</div></div>

<script type="module" src="js/book.js"></script>
</body>
</html>
